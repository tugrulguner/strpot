[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strpot"
version = "0.1.0"
description = "Compile neural models into bounded, hardware-adaptive CPU execution images"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Tugrul Guner" }]
keywords = ["llm", "inference", "cpu", "model", "compiler"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "tokenizers>=0.20",
    "typer>=0.12.0",
]

[project.optional-dependencies]
benchmark = [
    "numpy>=2.0",
    "torch>=2.7",
    "transformers>=4.48",
]

[dependency-groups]
dev = [
    "numpy>=2.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "torch>=2.7",
]

[project.urls]
Homepage = "https://github.com/tugrulguner/strpot"
Repository = "https://github.com/tugrulguner/strpot"
Issues = "https://github.com/tugrulguner/strpot/issues"

[project.scripts]
strpot = "strpot.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/strpot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.isort]
known-first-party = ["strpot"]
